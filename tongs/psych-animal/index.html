<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나는 무슨 동물일까?</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --fg: #f4f5f7; --muted: #9aa0aa;
    --accent: #6c8cff; --accent2: #ff8fb1; --line: #2a2e37; --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 480px; min-height: 100vh; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .top { color: var(--muted); font-size: 13px; letter-spacing: .3px; margin-bottom: 4px; }
  .progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 14px 0 28px; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s ease; }
  .q { font-size: 22px; font-weight: 700; line-height: 1.4; margin: 0 0 24px; }
  .opt {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 18px; margin-bottom: 12px;
    font-size: 16px; line-height: 1.4; transition: transform .08s ease, border-color .15s;
  }
  .opt:active { transform: scale(.985); border-color: var(--accent); }
  .spacer { flex: 1; }
  .center { text-align: center; }
  .emoji { font-size: 84px; margin: 8px 0 4px; }
  .rtitle { font-size: 28px; font-weight: 800; margin: 4px 0 10px; }
  .rdesc { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 auto 28px; max-width: 360px; }
  .btn {
    display: block; width: 100%; border: none; border-radius: var(--radius);
    padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 12px;
  }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hidden { display: none; }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="quiz">
    <div class="top">성격·심리 · 나는 무슨 동물일까?</div>
    <div class="progress"><i id="bar"></i></div>
    <h1 class="q" id="q"></h1>
    <div id="opts"></div>
  </div>

  <div id="result" class="hidden center">
    <div class="spacer"></div>
    <div class="emoji" id="r-emoji"></div>
    <div class="rtitle" id="r-title"></div>
    <p class="rdesc" id="r-desc"></p>
    <button class="btn btn-primary" id="share">결과 공유하기</button>
    <button class="btn btn-ghost" id="retry">다시 하기</button>
    <div class="spacer"></div>
  </div>
</div>

<script>
  // tongstongs 브릿지 스텁. 네이티브 WebView면 postMessage, 아니면 콘솔.
  const Tong = {
    share(payload) { this._post("share", payload); },
    track(event, props) { this._post("track", { event, props }); },
    close() { this._post("close", {}); },
    _post(type, data) {
      const msg = JSON.stringify({ type, data });
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
      else console.log("[tong]", msg);
    },
  };

  const TONG_ID = "psych-animal";
  const questions = [
    { q: "주말, 가장 끌리는 건?", a: [
      ["사람들과 약속 잡고 나간다", "dolphin"],
      ["혼자 좋아하는 걸 즐긴다", "cat"],
      ["새로운 걸 배우거나 정리한다", "owl"],
      ["뭔가 주도해서 일을 벌인다", "lion"]]},
    { q: "팀 프로젝트에서 나는?", a: [
      ["방향을 정하고 이끈다", "lion"],
      ["분위기를 띄우고 연결한다", "dolphin"],
      ["꼼꼼히 분석하고 검토한다", "owl"],
      ["내 몫을 조용히 해낸다", "cat"]]},
    { q: "스트레스 받을 때?", a: [
      ["혼자만의 시간이 필요하다", "cat"],
      ["수다로 풀어버린다", "dolphin"],
      ["원인을 분석한다", "owl"],
      ["몸을 움직여 돌파한다", "lion"]]},
    { q: "여행 스타일은?", a: [
      ["계획을 빡빡하게 짠다", "owl"],
      ["즉흥적으로 떠난다", "lion"],
      ["맛집·핫플 위주로 논다", "dolphin"],
      ["조용한 곳에서 쉰다", "cat"]]},
    { q: "친구들이 보는 나는?", a: [
      ["든든한 리더", "lion"],
      ["분위기 메이커", "dolphin"],
      ["똑똑한 해결사", "owl"],
      ["마이페이스 자유인", "cat"]]},
  ];
  const results = {
    lion:    { emoji: "🦁", title: "사자형", desc: "주도적이고 추진력 있는 타입. 목표가 보이면 가장 먼저 움직여 사람들을 이끌어요." },
    dolphin: { emoji: "🐬", title: "돌고래형", desc: "사교적이고 따뜻한 분위기 메이커. 사람들 사이를 연결하는 데 진심이에요." },
    owl:     { emoji: "🦉", title: "부엉이형", desc: "분석적이고 신중한 타입. 깊게 파고들어 똑똑한 해답을 찾아내요." },
    cat:     { emoji: "🐱", title: "고양이형", desc: "독립적이고 자유로운 마이페이스. 내 페이스로 즐기는 게 가장 중요해요." },
  };

  let step = 0;
  const score = { lion: 0, dolphin: 0, owl: 0, cat: 0 };
  const $ = (id) => document.getElementById(id);

  function render() {
    const item = questions[step];
    $("bar").style.width = (step / questions.length) * 100 + "%";
    $("q").textContent = item.q;
    const opts = $("opts");
    opts.innerHTML = "";
    opts.classList.remove("fade"); void opts.offsetWidth; opts.classList.add("fade");
    item.a.forEach(([label, key]) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = label;
      b.onclick = () => choose(key);
      opts.appendChild(b);
    });
  }

  function choose(key) {
    score[key]++;
    step++;
    if (step < questions.length) render();
    else finish();
  }

  function finish() {
    const top = Object.keys(score).reduce((a, b) => (score[b] > score[a] ? b : a));
    const r = results[top];
    $("bar").style.width = "100%";
    $("quiz").classList.add("hidden");
    $("r-emoji").textContent = r.emoji;
    $("r-title").textContent = "당신은 " + r.title;
    $("r-desc").textContent = r.desc;
    $("result").classList.remove("hidden");
    $("result").classList.add("fade");
    Tong.track("result", { tongId: TONG_ID, result: top });
    $("share").onclick = () =>
      Tong.share({ tongId: TONG_ID, result: top, text: `나는 ${r.title} ${r.emoji}! 너는?` });
    $("retry").onclick = () => location.reload();
  }

  Tong.track("start", { tongId: TONG_ID });
  render();
</script>
</body>
</html>
