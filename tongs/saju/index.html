<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의 사주 운세</title>
<meta property="og:title" content="나의 사주 운세" />
<style>
  :root {
    --bg: #14122b; --bg2: #1d1a3d; --card: #221f47;
    --fg: #f5f1e6; --muted: #a9a3c4; --gold: #e8c87a; --gold2: #c9a24a;
    --line: #322d5c; --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg));
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 480px; min-height: 100vh; padding: 28px 20px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .top { color: var(--gold); font-size: 13px; letter-spacing: 2px; margin-bottom: 6px; text-align: center; }
  .headline { font-size: 26px; font-weight: 800; text-align: center; margin: 2px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 28px; }
  .label { color: var(--muted); font-size: 13px; letter-spacing: .5px; margin: 0 0 8px 2px; }
  .row { display: flex; gap: 10px; margin-bottom: 18px; }
  select {
    flex: 1; appearance: none; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px;
    font-size: 16px; font-family: inherit;
  }
  select:focus { outline: none; border-color: var(--gold); }
  .spacer { flex: 1; }
  .center { text-align: center; }
  .seal {
    width: 132px; height: 132px; margin: 8px auto 6px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, var(--gold), var(--gold2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px rgba(232,200,122,.12), 0 14px 40px rgba(0,0,0,.45);
  }
  .seal .ji { font-size: 72px; }
  .rzodiac { color: var(--gold); font-size: 15px; letter-spacing: 3px; margin-top: 10px; }
  .rtitle { font-size: 30px; font-weight: 800; margin: 4px 0 4px; }
  .relem { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 18px; margin: 0 0 12px; text-align: left;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; color: var(--gold); letter-spacing: .5px; }
  .card p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--fg); }
  .btn {
    display: block; width: 100%; border: none; border-radius: var(--radius);
    padding: 17px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
    font-family: inherit;
  }
  .btn-primary { background: linear-gradient(90deg, var(--gold), var(--gold2)); color: #2a2306; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hidden { display: none; }
  .fade { animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app">
  <!-- 입력 -->
  <div id="form">
    <div class="spacer"></div>
    <div class="top">사 주 풀 이</div>
    <h1 class="headline">나의 사주 운세</h1>
    <p class="sub">생년월일로 보는 나의 띠 · 오행 · 2026년 운세</p>

    <p class="label">생년 (양력)</p>
    <div class="row"><select id="year"></select></div>
    <p class="label">월 / 일</p>
    <div class="row">
      <select id="month"></select>
      <select id="day"></select>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="go">운세 보기</button>
  </div>

  <!-- 결과 -->
  <div id="result" class="hidden center">
    <div class="spacer"></div>
    <div class="seal"><span class="ji" id="r-animal"></span></div>
    <div class="rzodiac" id="r-zodiac"></div>
    <div class="rtitle" id="r-title"></div>
    <div class="relem" id="r-elem"></div>
    <div class="card"><h3>타고난 기질</h3><p id="r-trait"></p></div>
    <div class="card"><h3>2026년 운세</h3><p id="r-luck"></p></div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="again">다시 보기</button>
  </div>
</div>

<script>
  // ⚠️ 정통 만세력이 아닌 엔터테인먼트용 근사 계산(연주 기준 띠·오행).
  const ANIMALS = [
    { ji: "子", name: "쥐",   emoji: "🐭" }, { ji: "丑", name: "소",     emoji: "🐮" },
    { ji: "寅", name: "범",   emoji: "🐯" }, { ji: "卯", name: "토끼",   emoji: "🐰" },
    { ji: "辰", name: "용",   emoji: "🐲" }, { ji: "巳", name: "뱀",     emoji: "🐍" },
    { ji: "午", name: "말",   emoji: "🐴" }, { ji: "未", name: "양",     emoji: "🐑" },
    { ji: "申", name: "원숭이", emoji: "🐵" }, { ji: "酉", name: "닭",   emoji: "🐔" },
    { ji: "戌", name: "개",   emoji: "🐶" }, { ji: "亥", name: "돼지",   emoji: "🐷" },
  ];
  const ELEMENTS = [ // 천간 → 오행
    { n: "목(木)", desc: "나무처럼 뻗어가는 성장과 인정" },
    { n: "화(火)", desc: "불처럼 빛나는 열정과 표현력" },
    { n: "토(土)", desc: "흙처럼 든든한 신뢰와 포용" },
    { n: "금(金)", desc: "쇠처럼 단단한 결단과 의리" },
    { n: "수(水)", desc: "물처럼 유연한 지혜와 직관" },
  ];
  const TRAITS = [
    "재치 있고 기민하며, 기회를 빠르게 포착하는 현실 감각이 뛰어납니다.",
    "성실하고 끈기 있어, 한번 시작한 일은 끝까지 밀고 나가는 뚝심이 있습니다.",
    "용맹하고 솔직하며, 불의를 보면 못 참는 정의로운 기질을 타고났습니다.",
    "온화하고 섬세하며, 주변을 살피는 다정함으로 사람을 끌어당깁니다.",
    "기상이 크고 당당하며, 큰 그림을 그리는 리더의 풍모가 있습니다.",
    "지혜롭고 신중하며, 속을 잘 드러내지 않는 깊이로 신비로운 매력이 있습니다.",
    "활달하고 자유로워, 어디서든 분위기를 살리는 밝은 에너지를 지녔습니다.",
    "여리고 예술적이며, 마음이 따뜻해 정 많은 사람으로 사랑받습니다.",
    "영리하고 재주가 많아, 손대는 일마다 빠르게 익히는 다재다능형입니다.",
    "부지런하고 꼼꼼하며, 미리 준비하는 계획성으로 실수가 적습니다.",
    "의리 있고 충직하여, 한번 맺은 인연을 오래 지키는 든든한 사람입니다.",
    "넉넉하고 복스러우며, 베풀수록 돌아오는 후덕한 복을 타고났습니다.",
  ];
  const LUCK = [
    "막혔던 길이 트이는 해입니다. 미뤄둔 일을 다시 꺼내면 좋은 결실이 따릅니다.",
    "꾸준함이 빛을 보는 해입니다. 작은 습관 하나가 큰 변화의 씨앗이 됩니다.",
    "사람으로 인한 기회가 많은 해입니다. 먼저 손 내미는 용기가 복을 부릅니다.",
    "안정과 화합의 해입니다. 가까운 인연을 챙길수록 마음이 든든해집니다.",
    "도약의 해입니다. 망설이던 도전을 시작하기에 더없이 좋은 흐름입니다.",
    "내실을 다지는 해입니다. 드러내기보다 준비하는 자에게 운이 기울어집니다.",
  ];

  const $ = (id) => document.getElementById(id);
  // 셀렉트 채우기
  (function init() {
    const y = $("year"), m = $("month"), d = $("day");
    for (let v = 2020; v >= 1950; v--) y.add(new Option(v + "년", v));
    for (let v = 1; v <= 12; v++) m.add(new Option(v + "월", v));
    for (let v = 1; v <= 31; v++) d.add(new Option(v + "일", v));
    y.value = 1996; m.value = 6; d.value = 11;
  })();

  function reveal(year) {
    const animal = ANIMALS[((year - 4) % 12 + 12) % 12];
    const elem = ELEMENTS[Math.floor((((year - 4) % 10) + 10) % 10 / 2)];
    const trait = TRAITS[((year - 4) % 12 + 12) % 12];
    const luck = LUCK[year % 6];

    $("r-animal").textContent = animal.emoji;
    $("r-zodiac").textContent = animal.ji + " · " + animal.name + "띠";
    $("r-title").textContent = elem.n.split("(")[0] + animal.name + "띠";
    $("r-elem").textContent = "오행 " + elem.n + " · " + elem.desc;
    $("r-trait").textContent = trait;
    $("r-luck").textContent = luck;

    $("form").classList.add("hidden");
    const r = $("result");
    r.classList.remove("hidden"); r.classList.add("fade");
  }

  $("go").addEventListener("click", () => reveal(parseInt($("year").value, 10)));
  $("again").addEventListener("click", () => {
    $("result").classList.add("hidden");
    const f = $("form");
    f.classList.remove("hidden"); f.classList.add("fade");
  });
</script>
</body>
</html>
