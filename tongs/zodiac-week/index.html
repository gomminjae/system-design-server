<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>이번 주 별자리 운세</title>
<style>
  :root{
    --bg-0:#070b1f;
    --bg-1:#0d1330;
    --bg-2:#141c44;
    --ink:#eef1ff;
    --ink-soft:#aab2dd;
    --ink-faint:#6b75a8;
    --gold:#ffd479;
    --gold-soft:#f2b95e;
    --violet:#9b7bff;
    --aqua:#74d8ff;
    --rose:#ff8fb6;
    --line:rgba(155,165,225,.16);
    --card:rgba(255,255,255,.045);
    --card-line:rgba(255,255,255,.09);
    --glow-violet:rgba(155,123,255,.45);
    --glow-gold:rgba(255,212,121,.4);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;
    background:var(--bg-0);
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    overflow-x:hidden;
  }

  #app{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:28px 22px calc(34px + env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 80% at 18% -8%, rgba(155,123,255,.28), transparent 55%),
      radial-gradient(130% 90% at 92% 6%, rgba(116,216,255,.18), transparent 52%),
      radial-gradient(140% 70% at 50% 108%, rgba(255,143,182,.14), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 60%, #05081a 100%);
    overflow:hidden;
  }

  /* starfield */
  .stars{position:absolute;inset:0;pointer-events:none;z-index:0;}
  .star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    opacity:.0;
    animation:twinkle var(--dur,3.5s) ease-in-out infinite;
    animation-delay:var(--dl,0s);
  }
  @keyframes twinkle{
    0%,100%{opacity:.12;transform:scale(.7);}
    50%{opacity:.95;transform:scale(1.15);}
  }
  .shoot{
    position:absolute;
    top:14%;left:-12%;
    width:90px;height:1.5px;
    background:linear-gradient(90deg,transparent,#fff,transparent);
    opacity:0;
    transform:rotate(18deg);
    filter:drop-shadow(0 0 6px #fff);
    animation:shoot 7s ease-in 2s infinite;
  }
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(18deg);}
    6%{opacity:.9;}
    16%{opacity:0;transform:translate(360px,120px) rotate(18deg);}
    100%{opacity:0;}
  }

  .screen{position:relative;z-index:2;}

  /* ---------- intro ---------- */
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;letter-spacing:.22em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .eyebrow::before{content:"";width:18px;height:1px;background:var(--gold);opacity:.6;}

  h1{
    font-size:30px;line-height:1.28;font-weight:800;letter-spacing:-.02em;
    margin-bottom:12px;
  }
  h1 .accent{
    background:linear-gradient(120deg,var(--gold),var(--rose),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .lead{
    font-size:14.5px;line-height:1.7;color:var(--ink-soft);
    margin-bottom:24px;max-width:34ch;
  }

  .week-pill{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--card-line);
    padding:7px 14px;border-radius:999px;margin-bottom:22px;
  }
  .week-pill b{color:var(--gold);font-weight:700;}

  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:11px;
  }
  .sign{
    position:relative;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:18px;
    padding:14px 8px 12px;
    text-align:center;
    cursor:pointer;
    transition:transform .18s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
    overflow:hidden;
  }
  .sign::after{
    content:"";position:absolute;inset:0;border-radius:18px;
    background:radial-gradient(80% 60% at 50% 0%, rgba(255,212,121,.18), transparent 70%);
    opacity:0;transition:opacity .3s ease;
  }
  .sign:hover::after{opacity:1;}
  .sign:active{transform:scale(.94);}
  .sign:hover{border-color:rgba(255,212,121,.4);background:rgba(255,255,255,.07);}
  .sign .glyph{font-size:27px;line-height:1;display:block;margin-bottom:7px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .sign .nm{font-size:12.5px;font-weight:700;letter-spacing:-.01em;}
  .sign .dt{font-size:10px;color:var(--ink-faint);margin-top:2px;letter-spacing:.01em;}

  .foot-note{
    margin-top:22px;font-size:11px;line-height:1.6;color:var(--ink-faint);text-align:center;
  }

  /* ---------- result ---------- */
  #result{display:none;}

  .result-hero{
    position:relative;
    text-align:center;
    padding:18px 0 6px;
  }
  .halo{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle, var(--glow-gold), transparent 65%);
    filter:blur(6px);z-index:0;
    animation:pulse 4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;transform:translateX(-50%) scale(.92);}50%{opacity:.95;transform:translateX(-50%) scale(1.06);}}

  .big-glyph{
    position:relative;z-index:1;font-size:74px;line-height:1;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.5));
    animation:floaty 5s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}

  .res-name{
    margin-top:12px;font-size:25px;font-weight:800;letter-spacing:-.02em;
  }
  .res-name .accent{
    background:linear-gradient(120deg,var(--gold),var(--rose));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .res-range{font-size:12.5px;color:var(--ink-faint);margin-top:5px;letter-spacing:.04em;}
  .res-tag{
    display:inline-block;margin-top:14px;
    font-size:13px;line-height:1.7;color:var(--ink);
    background:var(--card);border:1px solid var(--card-line);
    border-radius:14px;padding:11px 16px;max-width:32ch;
  }
  .res-tag .q{color:var(--gold);}

  .lucky-row{
    display:flex;gap:9px;margin:18px 0 6px;
  }
  .lucky{
    flex:1;background:var(--card);border:1px solid var(--card-line);
    border-radius:14px;padding:11px 8px;text-align:center;
  }
  .lucky .k{font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em;}
  .lucky .v{font-size:14px;font-weight:700;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px;}
  .swatch{width:13px;height:13px;border-radius:50%;display:inline-block;box-shadow:0 0 8px rgba(255,255,255,.25);}

  .cards{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
  .fcard{
    position:relative;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
    border:1px solid var(--card-line);
    border-radius:18px;
    padding:16px 17px;
    opacity:0;transform:translateY(14px);
    animation:rise .55s ease forwards;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  .fcard .head{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .fcard .ic{
    font-size:20px;width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);border:1px solid var(--card-line);
  }
  .fcard .lbl{font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .fcard .stars-rate{margin-left:auto;font-size:12px;letter-spacing:1px;}
  .fcard .body{font-size:13.5px;line-height:1.72;color:var(--ink-soft);}

  .c-tot{border-color:rgba(255,212,121,.32);box-shadow:0 8px 28px rgba(255,212,121,.08);}
  .c-tot .ic{color:var(--gold);background:rgba(255,212,121,.08);}
  .c-love .ic{color:var(--rose);background:rgba(255,143,182,.08);}
  .c-money .ic{color:#7be0a0;background:rgba(123,224,160,.08);}
  .c-health .ic{color:var(--aqua);background:rgba(116,216,255,.08);}

  .btn{
    margin-top:22px;width:100%;
    font-family:inherit;font-size:15px;font-weight:700;color:#0a0e26;
    background:linear-gradient(120deg,var(--gold),var(--gold-soft));
    border:none;border-radius:16px;padding:16px;cursor:pointer;
    letter-spacing:.01em;
    box-shadow:0 10px 26px rgba(255,212,121,.22);
    transition:transform .15s ease, box-shadow .25s ease, filter .2s ease;
  }
  .btn:active{transform:scale(.97);filter:brightness(.96);}

  .ghost-btn{
    margin-top:11px;width:100%;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    background:transparent;border:1px solid var(--card-line);border-radius:16px;
    padding:14px;cursor:pointer;transition:transform .15s ease,border-color .2s ease,color .2s ease;
  }
  .ghost-btn:active{transform:scale(.97);}
  .ghost-btn:hover{border-color:var(--gold-soft);color:var(--ink);}

  .disclaimer{
    margin-top:20px;font-size:11px;line-height:1.6;color:var(--ink-faint);text-align:center;
  }

  .fade-in{animation:fadeScale .5s ease both;}
  @keyframes fadeScale{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
</style>
</head>
<body>
  <div id="app">
    <div class="stars" id="stars"></div>
    <div class="shoot"></div>

    <!-- INTRO -->
    <section class="screen fade-in" id="intro">
      <span class="eyebrow">Weekly Horoscope</span>
      <h1>이번 주 나의<br><span class="accent">별자리 운세</span></h1>
      <p class="lead">밤하늘이 당신에게 건네는 한 주의 메시지. 당신의 별자리를 골라 이번 주의 흐름을 읽어보세요.</p>
      <div class="week-pill">🌙 <span>이번 주 · <b id="weekLabel">—</b></span></div>
      <div class="grid" id="grid"></div>
      <p class="foot-note">별자리를 탭하면 이번 주 총운·애정·금전·건강 운세가 펼쳐집니다.</p>
    </section>

    <!-- RESULT -->
    <section class="screen" id="result">
      <div class="result-hero">
        <div class="halo"></div>
        <div class="big-glyph" id="rGlyph">♈</div>
        <div class="res-name"><span class="accent" id="rName">양자리</span></div>
        <div class="res-range" id="rRange">3.21 – 4.19</div>
        <div class="res-tag" id="rTag"></div>
      </div>

      <div class="lucky-row">
        <div class="lucky"><div class="k">행운 숫자</div><div class="v" id="rNum">7</div></div>
        <div class="lucky"><div class="k">행운 색</div><div class="v"><span class="swatch" id="rSwatch"></span><span id="rColor">골드</span></div></div>
        <div class="lucky"><div class="k">키워드</div><div class="v" id="rKey">도전</div></div>
      </div>

      <div class="cards" id="cards"></div>

      <button class="btn" id="againBtn">다른 별자리 보기</button>
      <button class="ghost-btn" id="shareBtn">이번 주 운세 갈무리하기 ✨</button>
      <p class="disclaimer">본 콘텐츠는 재미를 위한 엔터테인먼트용이며, 실제 운세나 결과를 보장하지 않아요. 🌌</p>
    </section>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- starfield ---------- */
  var sf = document.getElementById('stars');
  var frag = document.createDocumentFragment();
  for(var i=0;i<54;i++){
    var s = document.createElement('span');
    s.className='star';
    var sz = (Math.random()*2+0.6).toFixed(1);
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=(Math.random()*100).toFixed(2)+'%';
    s.style.top=(Math.random()*100).toFixed(2)+'%';
    s.style.setProperty('--dur',(Math.random()*3+2.4).toFixed(2)+'s');
    s.style.setProperty('--dl',(Math.random()*4).toFixed(2)+'s');
    frag.appendChild(s);
  }
  sf.appendChild(frag);

  /* ---------- week label ---------- */
  function fmt(d){return (d.getMonth()+1)+'.'+d.getDate();}
  var now = new Date();
  var day = now.getDay(); // 0 sun..6 sat
  var mon = new Date(now); mon.setDate(now.getDate() - ((day+6)%7));
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  document.getElementById('weekLabel').textContent = fmt(mon)+' ~ '+fmt(sun);

  /* ---------- data ---------- */
  var Z = [
    {g:"♈",nm:"양자리",en:"Aries",range:"3.21 – 4.19",num:9,color:"스칼렛 레드",hex:"#ff5d5d",key:"돌파",
      tag:'이번 주의 키워드는 <span class="q">“먼저 움직이기”</span>',
      tot:"미뤄둔 일에 시동을 거는 순간 운이 따라붙어요. 머뭇거릴수록 흐름이 식으니, 주 초반의 추진력을 그대로 끝까지 밀고 가세요. 작은 결단이 한 주 전체의 색을 바꿉니다.",
      love:"솔직함이 무기예요. 빙빙 돌리지 말고 마음을 한 줄로 전해보면 의외의 화답이 옵니다. 솔로라면 활동적인 자리에서 불꽃 같은 인연이.",
      money:"즉흥 지출만 조심하면 흐름은 양호해요. 사고 싶은 게 생기면 하루만 묵혀두기. 그 하루가 통장을 지켜줍니다.",
      health:"에너지는 넘치지만 수면이 들쭉날쭉. 잠드는 시각만 맞춰도 컨디션이 확 살아나요."},

    {g:"♉",nm:"황소자리",en:"Taurus",range:"4.20 – 5.20",num:6,color:"포레스트 그린",hex:"#5fbf8a",key:"안정",
      tag:'이번 주의 키워드는 <span class="q">“천천히, 단단하게”</span>',
      tot:"서두르지 않아도 되는 주간이에요. 꾸준히 쌓아온 것들이 조용히 결실을 맺습니다. 남과 속도를 비교하지 말고 당신만의 리듬을 신뢰하세요.",
      love:"익숙한 사이일수록 다정한 표현이 필요해요. 함께하는 식사 한 끼가 관계의 온도를 올려줍니다. 변함없는 태도가 가장 큰 매력.",

      health:"목과 어깨에 긴장이 쌓이기 쉬워요. 따뜻한 차 한 잔과 가벼운 스트레칭으로 풀어주세요."},

    {g:"♊",nm:"쌍둥이자리",en:"Gemini",range:"5.21 – 6.21",num:5,color:"레몬 옐로",hex:"#ffe06b",key:"소통",
      tag:'이번 주의 키워드는 <span class="q">“말이 길을 연다”</span>',
      tot:"대화와 정보 속에 기회가 숨어 있어요. 가볍게 던진 한마디, 우연히 들은 소식이 좋은 인연이나 제안으로 이어집니다. 호기심을 따라가 보세요.",

    {g:"♋",nm:"게자리",en:"Cancer",range:"6.22 – 7.22",num:2,color:"문라이트 실버",hex:"#cfd6ff",key:"보살핌",
      tag:'이번 주의 키워드는 <span class="q">“마음을 돌보기”</span>',

      love:"공감 능력이 빛나는 시기. 상대의 말을 끝까지 들어주는 것만으로 관계가 깊어져요. 가족 같은 안정감이 사랑을 키웁니다.",
      money:"집·생활에 관련된 지출이 늘 수 있어요. 꼭 필요한 것과 위안용 소비를 구분하면 균형이 잡힙니다.",
      health:"속이 예민해지기 쉬워요. 따뜻하고 소화 잘되는 음식, 충분한 물 한 잔이 답이에요."},

    {g:"♌",nm:"사자자리",en:"Leo",range:"7.23 – 8.22",num:1,color:"로열 골드",hex:"#ffc24d",key:"빛남",
      tag:'이번 주의 키워드는 <span class="q">“무대의 주인공”</span>',
      tot:"존재감이 돋보이는 주간이에요. 사람들 앞에 설 일이 생기면 피하지 말고 당당히 빛나세요. 당신의 자신감이 주변까지 환하게 물들입니다.",
      love:"넘치는 매력에 시선이 모여요. 다만 받는 사랑만큼 표현해 주는 다정함이 관계를 오래 가게 합니다.",
      money:"보상이나 인정이 금전으로 이어질 기운. 너그러움은 좋지만 과시성 지출은 한 박자 늦추세요.",
      health:"심장과 활력은 좋아도 과로 주의. 박수받는 만큼 스스로에게도 휴식이라는 보상을."},

    {g:"♍",nm:"처녀자리",en:"Virgo",range:"8.23 – 9.22",num:4,color:"세이지 베이지",hex:"#bdb38f",key:"정돈",
      tag:'이번 주의 키워드는 <span class="q">“디테일이 운을 만든다”</span>',
      tot:"꼼꼼함이 인정받는 한 주예요. 남들이 놓친 작은 부분을 챙기는 당신의 눈썰미가 신뢰로 돌아옵니다. 다만 완벽주의는 조금 내려놓아도 괜찮아요.",
      love:"세심한 배려가 마음을 움직여요. 작은 챙김 하나가 큰 말보다 진하게 전해집니다. 너무 분석하지 말고 느끼는 대로.",
      money:"가계부를 정리하기 딱 좋은 시기. 새는 돈을 찾아 막으면 생각보다 큰 여유가 생겨요.",

  function rate(n){
    var full='★★★★★'.slice(0,n);
    var empty='☆☆☆☆☆'.slice(0,5-n);
    return full+empty;
  }
  // pseudo-deterministic per sign + week for stable star ratings
  function ratings(idx){
    var seed = (idx*31 + mon.getDate()*7) ;
    function r(off){ return 3 + ((seed*13 + off*17) % 3); } // 3..5
    return {tot:r(1),love:r(2),money:r(3),health:r(4)};
  }

  /* ---------- build grid ---------- */
  var grid = document.getElementById('grid');
  Z.forEach(function(z,idx){
    var el = document.createElement('div');
    el.className='sign';
    el.setAttribute('role','button');
    el.innerHTML='<span class="glyph">'+z.g+'</span><span class="nm">'+z.nm+'</span><span class="dt">'+z.range+'</span>';
    el.addEventListener('click',function(){show(idx);});
    grid.appendChild(el);
  });

  /* ---------- show result ---------- */
  var intro=document.getElementById('intro');
  var result=document.getElementById('result');

  function show(idx){
    var z=Z[idx];
    var rt=ratings(idx);
    document.getElementById('rGlyph').textContent=z.g;
    document.getElementById('rName').textContent=z.nm;
    document.getElementById('rRange').textContent=z.range;
    document.getElementById('rTag').innerHTML=z.tag;
    document.getElementById('rNum').textContent=z.num;
    document.getElementById('rColor').textContent=z.color;
    document.getElementById('rSwatch').style.background=z.hex;
    document.getElementById('rSwatch').style.boxShadow='0 0 9px '+z.hex;
    document.getElementById('rKey').textContent=z.key;

    var cards=document.getElementById('cards');
    var data=[
      {cls:'c-tot',ic:'🌟',lbl:'총운',body:z.tot,r:rt.tot},
      {cls:'c-love',ic:'💞',lbl:'애정운',body:z.love,r:rt.love},
      {cls:'c-money',ic:'💰',lbl:'금전운',body:z.money,r:rt.money},
      {cls:'c-health',ic:'🌿',lbl:'건강운',body:z.health,r:rt.health}
    ];
    cards.innerHTML='';
    data.forEach(function(c,i){
      var d=document.createElement('div');
      d.className='fcard '+c.cls;
      d.style.animationDelay=(0.08+i*0.1)+'s';
      d.innerHTML='<div class="head"><div class="ic">'+c.ic+'</div><div class="lbl">'+c.lbl+
        '</div><div class="stars-rate" style="color:var(--gold)">'+rate(c.r)+'</div></div>'+
        '<div class="body">'+c.body+'</div>';
      cards.appendChild(d);
    });

    intro.style.display='none';
    result.style.display='block';
    result.classList.remove('fade-in');
    void result.offsetWidth;
    result.classList.add('fade-in');
    window.scrollTo(0,0);
    if(document.getElementById('app').scrollTop!==undefined){document.getElementById('app').scrollTop=0;}
  }

  document.getElementById('againBtn').addEventListener('click',function(){
    result.style.display='none';
    intro.style.display='block';
    intro.classList.remove('fade-in');
    void intro.offsetWidth;
    intro.classList.add('fade-in');
    window.scrollTo(0,0);
  });

  document.getElementById('shareBtn').addEventListener('click',function(){
    var nm=document.getElementById('rName').textContent;
    var btn=this;
    var prev=btn.textContent;
    btn.textContent='이번 주 '+nm+' 운세를 가슴에 담았어요 ⭐';
    setTimeout(function(){btn.textContent=prev;},1700);
  });

})();
</script>
