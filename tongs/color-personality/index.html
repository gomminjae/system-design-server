<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내 안의 성격 컬러</title>
<style>
  :root {
    --bg: #f7f6f3;
    --ink: #16161a;
    --sub: #76767e;
    --card: #ffffff;
    --line: #e9e7e1;
    --accent: #16161a;
    --soft: rgba(0,0,0,.04);
    --radius: 20px;
    --r-r: 71, 85, 105;
    --tint: 245,244,241;
    transition: --tint .6s;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
    transition: background .6s ease;
  }
  #app {
    position: relative;
    width: 100%; max-width: 480px; min-height: 100vh;
    padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* intro */
  #intro { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .swatches { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
  .sw { width: 34px; height: 50px; border-radius: 40px; animation: bob 2.4s ease-in-out infinite; }
  .sw:nth-child(1){ background:#e8553e; animation-delay:0s; }
  .sw:nth-child(2){ background:#3a7bd5; animation-delay:.18s; }
  .sw:nth-child(3){ background:#f2b134; animation-delay:.36s; }
  .sw:nth-child(4){ background:#4caf7d; animation-delay:.54s; }
  .sw:nth-child(5){ background:#9b6dd1; animation-delay:.72s; }
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
  .kicker { font-size: 13px; letter-spacing: 3px; color: var(--sub); margin-bottom: 14px; font-weight: 600; }
  .big { font-size: 34px; line-height: 1.3; font-weight: 800; letter-spacing: -.5px; margin-bottom: 16px; }
  .lead { font-size: 15px; line-height: 1.7; color: var(--sub); max-width: 300px; margin: 0 auto 36px; }

  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .label { font-size: 12px; letter-spacing: 2px; color: var(--sub); font-weight: 700; text-transform: uppercase; }
  .count { font-size: 13px; color: var(--sub); font-weight: 600; }
  .progress { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-bottom: 40px; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 99px; transition: width .4s cubic-bezier(.4,0,.2,1); }

  .q { font-size: 25px; font-weight: 800; line-height: 1.4; letter-spacing: -.4px; margin-bottom: 30px; min-height: 70px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
    background: var(--card); color: var(--ink); border: 1.5px solid var(--line);
    border-radius: 16px; padding: 18px 18px; margin-bottom: 12px;
    font-size: 16px; line-height: 1.4; font-weight: 600;
    transition: transform .12s ease, border-color .2s, background .2s;
    font-family: inherit;
  }
  .opt .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .opt:active { transform: scale(.97); border-color: var(--ink); background: #fafaf8; }

  .spacer { flex: 1; }
  .center { text-align: center; }

  /* result */
  #result { flex: 1; display: flex; flex-direction: column; }
  .r-top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
  .halo {
    position: relative; width: 150px; height: 150px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
    background: radial-gradient(circle at 50% 40%, rgba(var(--r-r),.28), rgba(var(--r-r),0) 70%);
    animation: pulse 3s ease-in-out infinite;
  }
  .halo::after {
    content: ""; position: absolute; inset: 26px; border-radius: 50%;
    background: rgb(var(--r-r)); opacity: .14;
  }
  @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.05); } }
  .emoji { font-size: 76px; position: relative; z-index: 1; }
  .r-tag { font-size: 13px; letter-spacing: 3px; font-weight: 700; color: rgb(var(--r-r)); margin-bottom: 8px; }
  .r-title { font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 12px; }
  .r-sub { font-size: 16px; line-height: 1.7; color: var(--sub); max-width: 320px; margin: 0 auto; }

  .cards { margin-top: 8px; }
  .rc {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 16px 18px; margin-bottom: 10px; text-align: left;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .rc .ic { font-size: 22px; line-height: 1.4; }
  .rc .ct { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: rgb(var(--r-r)); margin-bottom: 3px; }
  .rc .cb { font-size: 14.5px; line-height: 1.6; color: var(--ink); font-weight: 500; }

  .match { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 18px 0 4px; font-size: 14px; color: var(--sub); font-weight: 600; }
  .match b { color: rgb(var(--r-r)); }

  .btn {
    display: block; width: 100%; border: none; border-radius: 16px;
    padding: 17px; font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform .12s ease, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--ink); color: #fff; margin: 16px 0 10px; }
  .disclaim { font-size: 11.5px; color: var(--sub); text-align: center; opacity: .8; margin-top: 6px; line-height: 1.5; }

  .hidden { display: none !important; }
  .fade { animation: fade .4s cubic-bezier(.2,0,.2,1); }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app">

  <!-- INTRO -->
  <section id="intro">
    <div class="swatches"><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span><span class="sw"></span></div>
    <div class="kicker">COLOR PERSONALITY</div>
    <h1 class="big">내 안의<br>성격 컬러</h1>
    <p class="lead">5개의 질문으로 당신의 마음을 물들이는<br>고유한 색을 찾아드려요.</p>
    <button class="btn btn-primary" id="start" style="max-width:300px;margin:0 auto;width:100%;">시작하기</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span class="label">Question</span>
      <span class="count" id="count"></span>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <h2 class="q" id="q"></h2>
    <div id="opts"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="r-top">
      <div class="halo"><div class="emoji" id="r-emoji"></div></div>
      <div class="r-tag" id="r-tag"></div>
      <div class="r-title" id="r-title"></div>
      <p class="r-sub" id="r-sub"></p>
    </div>
    <div class="cards" id="cards"></div>
    <div class="match" id="match"></div>
    <button class="btn btn-primary" id="retry">다시 진단하기</button>
    <p class="disclaim disclaimer" id="disc">본 결과는 재미로 보는 엔터테인먼트용 콘텐츠예요.</p>
  </section>

</div>

<script>
(function(){
  // ---- data ----
  var COLORS = {
    red:    { rgb:"232,85,62",   bg:"253,242,240", name:"패션 레드", tag:"PASSION RED", emoji:"🔥",
      sub:"멈춰 있지 못하는 사람. 끓어오르는 에너지로 분위기를 바꾸고 사람을 이끄는 타고난 추진력의 소유자예요.",
      cards:[
        {ic:"⚡", t:"강점", b:"결정이 빠르고 행동이 앞선다. 도전 앞에서 가장 빛나는 타입."},
        {ic:"🌱", t:"성장 포인트", b:"가끔은 속도를 늦추고 주변의 템포를 기다려주면 더 멀리 갈 수 있어요."},
        {ic:"🎯", t:"어울리는 순간", b:"새로운 프로젝트의 첫 발을 떼는 순간, 당신이 주인공."}
      ], match:"그린", matchEmoji:"🌿" },
    blue:   { rgb:"58,123,213",  bg:"239,245,253", name:"카밍 블루", tag:"CALMING BLUE", emoji:"🌊",
      sub:"깊고 잔잔한 바다 같은 사람. 흔들리는 상황 속에서도 침착하게 중심을 잡아주는 신뢰의 컬러예요.",
      cards:[
        {ic:"🧭", t:"강점", b:"논리적이고 차분하다. 위기 속에서 가장 믿음직한 존재."},
        {ic:"🌱", t:"성장 포인트", b:"생각을 조금만 더 꺼내 보여주면 사람들이 당신께 더 가까이 다가와요."},
        {ic:"🎯", t:"어울리는 순간", b:"복잡한 문제를 차근차근 정리해야 할 때 빛을 발해요."}
      ], match:"옐로", matchEmoji:"☀️" },
    yellow: { rgb:"242,177,52",  bg:"254,249,237", name:"선샤인 옐로", tag:"SUNSHINE YELLOW", emoji:"☀️",
      sub:"존재만으로 환해지는 사람. 호기심과 웃음을 몰고 다니며 주변을 따뜻하게 데우는 햇살 같은 컬러예요.",
      cards:[
        {ic:"✨", t:"강점", b:"긍정 에너지와 친화력. 어떤 자리에서도 분위기를 살린다."},
        {ic:"🌱", t:"성장 포인트", b:"흥미가 흩어질 땐 하나에 끝까지 머무는 연습이 큰 무기가 돼요."},
        {ic:"🎯", t:"어울리는 순간", b:"새로운 사람들과 처음 만나는 자리에서 가장 반짝여요."}
      ], match:"퍼플", matchEmoji:"🔮" },
    green:  { rgb:"76,175,125",  bg:"240,249,244", name:"밸런스 그린", tag:"BALANCE GREEN", emoji:"🌿",
      sub:"숲처럼 너른 사람. 서두르지 않고 주변을 보살피며 모두가 편안해지는 균형을 만들어내는 컬러예요.",
      cards:[
        {ic:"🤲", t:"강점", b:"공감 능력과 배려심. 사람과 사람 사이를 부드럽게 잇는다."},
        {ic:"🌱", t:"성장 포인트", b:"남보다 내 마음도 먼저 챙겨주세요. 당신의 평화가 가장 소중해요."},
        {ic:"🎯", t:"어울리는 순간", b:"갈등이 생긴 팀을 다시 하나로 모을 때 진가가 드러나요."}
      ], match:"레드", matchEmoji:"🔥" },
    purple: { rgb:"155,109,209",  bg:"247,242,253", name:"드림 퍼플", tag:"DREAM PURPLE", emoji:"🔮",
      sub:"현실 너머를 보는 사람. 남들이 놓친 결을 포착하는 감수성과 상상력으로 자기만의 세계를 짓는 컬러예요.",
      cards:[
        {ic:"🎨", t:"강점", b:"창의력과 직관. 평범한 것을 특별하게 바꾸는 안목을 가졌다."},
        {ic:"🌱", t:"성장 포인트", b:"머릿속 아이디어를 작게라도 꺼내 보면 세상이 알아봐 줘요."},
        {ic:"🎯", t:"어울리는 순간", b:"무에서 유를 만들어야 하는 창작의 순간에 가장 자유로워요."}
      ], match:"블루", matchEmoji:"🌊" }
  };

  var QUESTIONS = [
    { q:"주말, 갑자기 통째로 비었어요.\n당신의 선택은?",
      opts:[
        {t:"즉흥 여행, 일단 떠나!", c:"red"},
        {t:"밀린 책과 함께 고요한 휴식", c:"blue"},
        {t:"친구들 불러서 왁자지껄 모임", c:"yellow"},
        {t:"동네 산책하며 느긋하게", c:"green"},
        {t:"전시 보러, 영감 채우러", c:"purple"}
      ]},
    { q:"새로운 모임에 들어갔어요.\n첫날의 당신은?",
      opts:[
        {t:"먼저 말 걸고 판을 주도한다", c:"red"},
        {t:"조용히 관찰하며 파악한다", c:"blue"},
        {t:"여기저기 농담하며 친해진다", c:"yellow"},
        {t:"어색한 사람 곁을 챙겨준다", c:"green"},
        {t:"독특한 사람에게 끌린다", c:"purple"}
      ]},
    { q:"중요한 결정을 앞두고\n당신이 가장 믿는 것은?",
      opts:[
        {t:"끌리는 대로, 추진력!", c:"red"},
        {t:"데이터와 냉철한 분석", c:"blue"},
        {t:"그 순간의 기분과 직감", c:"yellow"},
        {t:"주변 사람들과의 조화", c:"green"},
        {t:"마음속 상상과 영감", c:"purple"}
      ]},
    { q:"친구가 고민을 털어놓아요.\n당신의 반응은?",
      opts:[
        {t:"\"그럼 이렇게 해, 바로 가자!\"", c:"red"},
        {t:"\"상황을 정리해서 보자\"", c:"blue"},
        {t:"\"기분 풀게 일단 놀자!\"", c:"yellow"},
        {t:"\"많이 힘들었겠다…\" 끄덕끄덕", c:"green"},
        {t:"\"다른 시선으로 보면 어때?\"", c:"purple"}
      ]},
    { q:"당신을 한 단어로 칠한다면\n어떤 느낌에 가까워요?",
      opts:[
        {t:"뜨겁게 타오르는 불꽃", c:"red"},
        {t:"깊고 잔잔한 심해", c:"blue"},
        {t:"눈부시게 빛나는 햇살", c:"yellow"},
        {t:"포근하게 감싸는 숲", c:"green"},
        {t:"몽환적인 보랏빛 노을", c:"purple"}
      ]}
  ];

  // ---- state ----
  var idx = 0;
  var score = { red:0, blue:0, yellow:0, green:0, purple:0 };
  var order = ["red","blue","yellow","green","purple"]; // tie-break priority by first reached

  var elIntro = document.getElementById('intro');
  var elQuiz = document.getElementById('quiz');
  var elResult = document.getElementById('result');
  var elQ = document.getElementById('q');
  var elOpts = document.getElementById('opts');
  var elBar = document.getElementById('bar');
  var elCount = document.getElementById('count');
  var root = document.documentElement;

  function rgbOf(c){ return COLORS[c].rgb; }

  function render(){
    var item = QUESTIONS[idx];
    elQ.textContent = item.q;
    elCount.textContent = (idx+1) + " / " + QUESTIONS.length;
    elBar.style.width = ((idx)/QUESTIONS.length*100) + "%";
    elOpts.innerHTML = "";
    item.opts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'opt';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = 'rgb(' + rgbOf(o.c) + ')';
      var span = document.createElement('span');
      span.textContent = o.t;
      b.appendChild(dot); b.appendChild(span);
      b.addEventListener('click', function(){ choose(o.c); });
      elOpts.appendChild(b);
    });
    elQuiz.classList.remove('fade'); void elQuiz.offsetWidth; elQuiz.classList.add('fade');
  }

  function choose(c){
    score[c]++;
    idx++;
    if (idx >= QUESTIONS.length){ finish(); }
    else { render(); }
  }

  function winner(){
    var best = null, bestVal = -1;
    for (var i=0;i<order.length;i++){
      var c = order[i];
      if (score[c] > bestVal){ bestVal = score[c]; best = c; }
    }
    return best;
  }

  function finish(){
    elBar.style.width = "100%";
    var c = winner();
    var d = COLORS[c];
    root.style.setProperty('--r-r', d.rgb);

    // dynamic page background -> soft tint of the color
    document.body.style.background = "rgb(" + d.bg + ")";
    root.style.setProperty('--card', '#ffffff');

    document.getElementById('r-emoji').textContent = d.emoji;
    document.getElementById('r-tag').textContent = d.tag;
    document.getElementById('r-title').textContent = d.name;
    document.getElementById('r-sub').textContent = d.sub;

    var cards = document.getElementById('cards');
    cards.innerHTML = "";
    d.cards.forEach(function(cd){
      var div = document.createElement('div');
      div.className = 'rc';
      div.innerHTML = '<div class="ic">'+cd.ic+'</div><div><div class="ct">'+cd.t+'</div><div class="cb">'+cd.b+'</div></div>';
      cards.appendChild(div);
    });

    document.getElementById('match').innerHTML = '잘 맞는 컬러 &nbsp; '+ d.matchEmoji +' &nbsp;<b>'+ d.match +'</b>';

    elQuiz.classList.add('hidden');
    elResult.classList.remove('hidden');
    elResult.classList.remove('fade'); void elResult.offsetWidth; elResult.classList.add('fade');
  }

  function reset(){
    idx = 0;
    score = { red:0, blue:0, yellow:0, green:0, purple:0 };
    document.body.style.background = "var(--bg)";
    root.style.setProperty('--r-r', '71, 85, 105');
    elResult.classList.add('hidden');
    elQuiz.classList.remove('hidden');
    render();
  }

  document.getElementById('start').addEventListener('click', function(){
    elIntro.classList.add('hidden');
    elQuiz.classList.remove('hidden');
    render();
  });
  document.getElementById('retry').addEventListener('click', reset);
})();
</script>
</body>
</html>
