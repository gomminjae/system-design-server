name: Deploy to Fly.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    # FLY_API_TOKEN을 GitHub의 production Environment에 저장한 경우에도
    # 이 잡에서 해당 Secret을 읽을 수 있도록 환경을 명시한다.
    environment: production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check Fly.io credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not available in the production Environment or repository secrets."
            exit 1
          fi
      # Swift release 빌드는 기본 원격 빌더 메모리를 초과할 수 있어 Depot 빌더를 사용한다.
      - run: flyctl deploy --depot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
