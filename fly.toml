app = "tongstongs-server"
primary_region = "sin"  # 싱가포르 — Supabase DB 리전(ap-southeast-1)과 동일

[build]

# 배포 직전 DB 마이그레이션 (운영은 부팅 자동 마이그레이션을 하지 않음)
[deploy]
  release_command = "migrate --env production --yes"

[env]
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  # scale-to-zero: 트래픽 없으면 머신 정지(비용 0), 요청 오면 자동 기상
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# 통 번들은 Supabase Storage에 저장 → 앱은 stateless. Fly volume 불필요.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
